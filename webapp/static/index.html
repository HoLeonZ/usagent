<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>usagent 策略平台</title>
<style>
:root{--bg:#0f1115;--fg:#e6e8ee;--dim:#9aa3b2;--line:#262b36;--up:#31c48d;--dn:#f05252;
      --warn:#f6ad55;--card:#161a21}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,
     "Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:20px;margin:0 0 6px}
h2{font-size:16px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sub{color:var(--dim);font-size:12.5px}
.banner{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--warn);
        background:#1a1712;border-radius:6px;font-size:12.5px;color:#f0d9b5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px}
.card h3{margin:0 0 4px;font-size:14.5px}
.card .mech{color:var(--dim);font-size:12.5px;margin:0 0 9px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:3px 6px;border-bottom:1px solid #20242c;vertical-align:top;text-align:left}
th{color:var(--dim);font-weight:400}
td.k{color:var(--dim);width:46%}
.verdict{margin:9px 0 0;padding:8px 9px;background:#141a16;border-left:3px solid var(--up);
         border-radius:5px;font-size:12px;color:#cfe3d6;max-height:150px;overflow:auto;white-space:pre-wrap}
.verdict.none{border-left-color:var(--warn);color:#f0d9b5}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
input[type=date]{background:#0c0f13;color:var(--fg);border:1px solid var(--line);border-radius:5px;
                 padding:4px 6px;font-size:12.5px}
button{background:#22303f;color:#dce7f2;border:1px solid #33475c;border-radius:6px;padding:6px 13px;
       font-size:13px;cursor:pointer}
button:hover{background:#2a3b4d}
button:disabled{opacity:.5;cursor:default}
.pos{color:var(--up)}.neg{color:var(--dn)}.warn{color:var(--warn)}
.run{margin:22px 0 0;padding:14px;border:1px solid #33475c;border-radius:8px;background:#12171e;display:none}
.steps{font-size:12.5px;color:var(--dim);margin:8px 0}
.steps div{padding:1px 0}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;margin-top:8px}
.metrics div{font-size:12.5px;display:flex;justify-content:space-between;border-bottom:1px solid #1d222a;padding:2px 0}
.metrics span:first-child{color:var(--dim)}
iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:10px}
code{font-size:12px;color:#cbd5e1}
ul.runs{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--dim)}
</style>
</head>
<body><div class="wrap">

<h1>usagent 策略平台</h1>
<div class="sub">目录来自注册表本身（<code>research/preset_defs/</code> · <code>research/family_defs/</code>）——
  新增一条策略后刷新本页即可。点「回测」跑一次，结果用**同一个**公共渲染能力出图（K 线 / 入场价 /
  出场价 / SL·TP / 当日指标）。</div>

<div class="banner" id="banner">正在读目录…</div>

<div id="content"></div>

<div class="run" id="run">
  <div id="runhead"><b>正在回测…</b></div>
  <div class="steps" id="steps"></div>
  <div id="result"></div>
</div>

<h2>最近运行（台账）</h2>
<div class="sub">每点一次都会记账：<code>research/results/web_runs.jsonl</code>。
  一个能一键重跑的界面会诱发 p-hacking —— 纪律的做法不是禁止点击，而是**让次数可见**（§5 迭代记账）。</div>
<ul class="runs" id="runs"></ul>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (v, d=2) => (v === null || v === undefined || !isFinite(v)) ? "—" : (v*100).toFixed(d) + "%";
const num = (v, d=3) => (v === null || v === undefined || !isFinite(v)) ? "—" : v.toFixed(d);
const HOLDOUT = ["2025-10-14", "2026-10-13"];
const overlaps = (a, b) => !(a[1] < b[0] || b[1] < a[0]);
const DEFAULT_WINDOW = ["2024-04-09", "2026-10-14"];

let CAT = null;

function paramTable(e) {
  // preset：引擎口径（与 CLI / 报告同一个函数）；族：网格 + 本组参数
  if (e.kind === "preset") {
    const rows = e.engine_spec.map(x => `<tr><td class="k">${esc(x.label)}</td><td>${esc(x.value)}</td></tr>`).join("");
    const s = e.strategy;
    const extra = s.type === "family"
      ? `<tr><td class="k">入场族</td><td>${esc(s.family)} ${esc(JSON.stringify(s.family_params))}</td></tr>`
      : `<tr><td class="k">信号参数</td><td>${esc(JSON.stringify(s.signal_params))}</td></tr>`;
    return `<table>${rows}${extra}
      <tr><td class="k">试验次数 n_comparisons</td><td>${e.n_comparisons}</td></tr>
      <tr><td class="k">validated</td><td>${e.validated ? "true" : "false"}</td></tr>
      <tr><td class="k">锁窗口</td><td>${esc(e.window.join(" .. "))}${e.touches_holdout
        ? ' <span class="warn">（含 holdout 天数）</span>' : ""}</td></tr>
    </table>`;
  }
  const grid = Object.entries(e.grid).map(([k, v]) =>
    `<tr><td class="k">${esc(k)}</td><td>${esc(JSON.stringify(v))}</td></tr>`).join("") || "<tr><td>（参考族：无网格）</td><td></td></tr>";
  return `<table>${grid}
    <tr><td class="k">网格组数</td><td>${e.grid_size}</td></tr>
    <tr><td class="k">默认取哪一组</td><td>${esc(JSON.stringify(e.default_params))}
      <span class="sub">（网格中点，不是搜索最优）</span></td></tr>
    <tr><td class="k">排序分</td><td>${esc(e.score_col)}${e.score_negated ? "（取负）" : ""}</td></tr>
    <tr><td class="k">需要 regime</td><td>${e.needs_regime ? "是" : "否"}</td></tr>
    ${e.control_arm ? `<tr><td class="k">方向对照臂</td><td>${esc(e.control_arm)}</td></tr>` : ""}
    ${e.delivered_as.length ? `<tr><td class="k">已交付为</td><td>${esc(e.delivered_as.join(", "))}</td></tr>` : ""}
  </table>`;
}

function card(e, runs) {
  const w = (e.kind === "preset") ? e.window : DEFAULT_WINDOW;
  const held = overlaps(w, HOLDOUT);
  const verdict = (e.verdict || "").trim();
  const vbox = e.kind === "preset"
    ? `<div class="verdict ${verdict ? "" : "none"}">${verdict ? esc(verdict) : "（本策略没有声明负面证据 —— §5 要求负面证据与参数同时记录）"}</div>`
    : `<div class="verdict none">族本身没有 VERDICT（它是候选机制，不是交付物）。跑出来的报告会就地写明这一点。</div>`;
  return `<div class="card">
    <h3>${esc(e.name)}</h3>
    <p class="mech">${esc(e.kind === "preset" ? (e.is_cli_default ? "preset · CLI 默认" : "preset")
      : "族 · " + e.mechanism)}</p>
    ${paramTable(e)}
    <div class="bar">
      <label>窗口 <input type="date" id="lo-${e.kind}-${e.id}" value="${w[0]}">
        → <input type="date" id="hi-${e.kind}-${e.id}" value="${w[1]}"></label>
      <button onclick="run('${e.kind}','${e.id}')">回测</button>
      <span class="sub">本条已被跑过 <b>${runs[e.kind + ":" + e.id] || 0}</b> 次</span>
      <span class="sub ${held ? "warn" : ""}" id="flag-${e.kind}-${e.id}">${held ? "⚠ 与 holdout 重叠（只准读一次）" : ""}</span>
    </div>
    ${vbox}
  </div>`;
}

async function load() {
  CAT = await (await fetch("/api/catalog")).json();
  const rr = await (await fetch("/api/runs")).json();
  const runs = {};
  (rr.runs || []).forEach(r => { runs[r.strategy_id] = (runs[r.strategy_id] || 0) + 1; });
  $("banner").innerHTML = `目录：<b>${CAT.presets.length}</b> 条 preset · <b>${CAT.families.length}</b> 个族 ·
    其中 <b>${CAT.notes.holdout_presets}</b> 条 preset 的声明窗口含 holdout 天数（页面上标红）。
    族的默认参数 = ${esc(CAT.notes.family_default_params)}；${esc(CAT.notes.multiplicity)}`;
  $("content").innerHTML =
    `<h2>交付 preset（6 条）</h2><div class="grid">${CAT.presets.map(e => card(e, runs)).join("")}</div>
     <h2>策略族（候选机制，15 个）</h2><div class="grid">${CAT.families.map(e => card(e, runs)).join("")}</div>`;
  // 窗口一改就重判 holdout 标红
  // 输入框 id = "<lo|hi>-<kind>-<策略id>"；kind 只有 preset/family 两种，按前缀剥掉即可
  document.querySelectorAll("input[type=date]").forEach(inp => inp.addEventListener("change", () => {
    const rest = inp.id.replace(/^(lo|hi)-/, "");
    const kind = rest.startsWith("preset-") ? "preset" : "family";
    const id = rest.slice(kind.length + 1);
    const lo = $("lo-" + kind + "-" + id).value, hi = $("hi-" + kind + "-" + id).value;
    const f = $("flag-" + kind + "-" + id);
    f.textContent = overlaps([lo, hi], HOLDOUT) ? "⚠ 与 holdout 重叠（只准读一次）" : "";
    f.className = "sub " + (overlaps([lo, hi], HOLDOUT) ? "warn" : "");
  }));
  $("runs").innerHTML = (rr.runs || []).map(r =>
    `<li>${esc(r.ts)} · <b>${esc(r.strategy_id)}</b> · ${esc((r.window || []).join(".."))} ·
      ${r.n_trades} 笔 · 超额 ${pct(r.excess)} · k=${r.n_trials_k}${r.note ? " · " + esc(r.note) : ""}</li>`
    ).join("") || "<li>（还没有运行记录）</li>";
}

async function run(kind, id) {
  const lo = $("lo-" + kind + "-" + id).value, hi = $("hi-" + kind + "-" + id).value;
  $("run").style.display = "block";
  $("result").innerHTML = ""; $("steps").innerHTML = "";
  $("runhead").innerHTML = `<b>正在回测 ${esc(kind)}:${esc(id)}</b> <span class="sub">${esc(lo)} .. ${esc(hi)}</span>`;
  const r = await fetch("/api/run", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({kind, id, lo, hi})});
  const j = await r.json();
  if (j.error) { $("runhead").innerHTML = `<b class="neg">提交失败：${esc(j.error)}</b>`; return; }
  poll(j.id);
}

async function poll(id) {
  const st = await (await fetch("/api/job/" + id)).json();
  if (!st || st.error) { $("runhead").innerHTML = `<b class="neg">任务丢失</b>`; return; }
  $("steps").innerHTML = (st.steps || []).map(s =>
    `<div>✓ ${esc(s.name)} <span class="sub">${s.seconds}s</span></div>`).join("")
    + (st.status === "running" ? `<div>… ${esc(st.step)}</div>` : "");
  if (st.status === "running" || st.status === "queued") { setTimeout(() => poll(id), 900); return; }
  if (st.status === "error") {
    $("runhead").innerHTML = `<b class="neg">回测失败</b>`;
    $("result").innerHTML = `<div class="verdict none">${esc(st.error)}</div>`;
    return;
  }
  const m = st.metrics, k = m.k_breakdown;
  const cls = (v) => v >= 0 ? "pos" : "neg";
  $("runhead").innerHTML = `<b>回测完成</b> <span class="sub">${esc(st.seconds)}s ·
    报告自检 ${st.selfcheck && st.selfcheck.length ? "**失败**：" + esc(st.selfcheck.join("；")) : "通过"}</span>`;
  $("result").innerHTML = `
    <div class="metrics">
      <div><span>成交笔数</span><b>${m.n_trades}</b></div>
      <div><span>自身收益</span><b class="${cls(m.own_ret)}">${pct(m.own_ret)}</b></div>
      <div><span>CAGR</span><b class="${cls(m.cagr)}">${pct(m.cagr)}</b></div>
      <div><span>平均敞口</span><b>${pct(m.exposure, 1)}</b></div>
      <div><span>同窗等权池 CAGR</span><b class="${cls(m.bench_cagr)}">${pct(m.bench_cagr)}</b></div>
      <div><span>曝光匹配超额</span><b class="${cls(m.excess)}">${pct(m.excess)}</b></div>
      <div><span>超额/敞口</span><b class="${cls(m.excess_per_exposure)}">${pct(m.excess_per_exposure, 1)}</b></div>
      <div><span>beta</span><b>${num(m.beta, 2)}</b></div>
      <div><span>alpha 年化</span><b class="${cls(m.alpha_annual)}">${pct(m.alpha_annual)}</b></div>
      <div><span>t(alpha)</span><b>${num(m.t_alpha, 2)}</b></div>
      <div><span>判据折为正</span><b>${m.folds_positive}/4</b></div>
      <div><span>最大回撤</span><b class="neg">${pct(m.maxdd, 1)}</b></div>
      <div><span>E[R]</span><b class="${cls(m.E_R)}">${num(m.E_R)}</b></div>
      <div><span>胜率</span><b>${pct(m.win_pct, 1)}</b></div>
      <div><span>盈亏比 PF</span><b>${num(m.profit_factor, 2)}</b></div>
      <div><span>最好 10% 占总 R</span><b>${pct(m.top_decile_share, 1)}</b></div>
      <div><span>DSR</span><b>${num(m.dsr)}</b></div>
      <div><span>DSR 的 k</span><b>${m.dsr_k} <span class="sub">(声明 ${k.declared_or_grid} +
        平台已跑 ${k.platform_runs_before})</span></b></div>
    </div>
    <div class="bar"><a href="${st.report}" target="_blank"><button>在新窗口打开逐笔报告（K线/入场价/出场价/SL·TP/指标）</button></a>
      <span class="sub">报告是自包含 HTML（无外链、无脚本）—— 可直接下载归档</span></div>
    <iframe src="${st.report}" loading="lazy"></iframe>`;
  load();   // 刷新台账与计数
}

load();
</script>
</div></body></html>
